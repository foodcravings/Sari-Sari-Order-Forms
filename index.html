<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SARI SARI ORDER FORM</title>
<style>
body{font-family:Arial,sans-serif;background:#fff7dd;margin:0;padding:20px;color:#332211}.wrap{max-width:720px;margin:auto;background:#fff;padding:26px;border-radius:18px;box-shadow:0 6px 24px #0002}h1{color:#8b5700;margin:0 0 24px}label{font-weight:700}input,select,button{box-sizing:border-box;font-size:16px;border:1px solid #bbb;border-radius:10px}input{width:100%;padding:13px;margin-top:7px}.row{display:grid;grid-template-columns:90px 1fr 120px;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid #eee}.photo{width:90px;height:82px;border-radius:12px;object-fit:cover;background:#eee}.name{font-weight:700;font-size:17px}.price{font-size:14px;color:#665;margin-top:3px}select{width:100%;padding:12px;background:white}.total{font-size:23px;font-weight:700;color:#8b5700;margin-top:20px}button{width:100%;padding:14px;background:#936000;color:white;border:0;font-weight:700;cursor:pointer;margin-top:20px}button:disabled{opacity:.6}#msg{margin-top:14px;font-weight:700}.ok{color:#18723c}.err{color:#b42318}@media(max-width:520px){body{padding:8px}.wrap{padding:18px}.row{grid-template-columns:70px 1fr 85px;gap:10px}.photo{width:70px;height:65px}h1{font-size:27px}}
</style>
</head>
<body><main class="wrap"><h1>SARI SARI ORDER FORM</h1><form id="form">
<label for="name">Customer Name</label><input id="name" required maxlength="80" placeholder="Enter name">
<div class="row"><img class="photo" src="BALOT.PNG.png" alt="Balot"><div><div class="name">Balot</div><div class="price">₱25 each</div></div><select id="balot" aria-label="Balot quantity"></select></div>
<div class="row"><img class="photo" src="penoy.png.png" alt="Penoy Sabaw"><div><div class="name">Penoy Sabaw</div><div class="price">₱20 each</div></div><select id="penoySabaw" aria-label="Penoy Sabaw quantity"></select></div>
<div class="row"><img class="photo" src="penoy.png.png" alt="Penoy Tuyo"><div><div class="name">Penoy Tuyo</div><div class="price">₱20 each</div></div><select id="penoyTuyo" aria-label="Penoy Tuyo quantity"></select></div>
<div class="row"><img class="photo" src="Pugo.png.png" alt="Pugo"><div><div class="name">Pugo</div><div class="price">₱5 each</div></div><select id="pugo" aria-label="Pugo quantity"></select></div>
<div class="row"><img class="photo" src="Suka small.jpg" alt="Suka Small"><div><div class="name">Suka Small</div><div class="price">₱60 each</div></div><select id="sukaSmall" aria-label="Suka Small quantity"></select></div>
<div class="row"><img class="photo" src="Suka big.jpg" alt="Suka Big"><div><div class="name">Suka Big</div><div class="price">₱100 each</div></div><select id="sukaBig" aria-label="Suka Big quantity"></select></div>
<div id="total" class="total">Total: ₱0</div><button id="btn" type="submit">Submit Order</button><div id="msg" aria-live="polite"></div>
</form></main>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbwZctds0Si3wyhT-psJt30BBlXgTRh-A-272DCYWM86wKGWSp5mM0Fyly6K3avin-YE/exec';
const ids=['balot','penoySabaw','penoyTuyo','pugo','sukaSmall','sukaBig'];const prices={balot:25,penoySabaw:20,penoyTuyo:20,pugo:5,sukaSmall:60,sukaBig:100};
ids.forEach(id=>{const s=document.getElementById(id);for(let i=0;i<=50;i++){const o=document.createElement('option');o.value=i;o.textContent=i;s.appendChild(o)}s.addEventListener('change',updateTotal)});
function updateTotal(){let t=0;ids.forEach(id=>t+=Number(document.getElementById(id).value||0)*prices[id]);document.getElementById('total').textContent='Total: ₱'+t.toLocaleString('en-PH');return t}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg'),btn=document.getElementById('btn'),name=document.getElementById('name').value.trim();msg.className='';msg.textContent='';if(!name){msg.className='err';msg.textContent='Please enter customer name.';return}const data={name};let count=0;ids.forEach(id=>{data[id]=Number(document.getElementById(id).value||0);count+=data[id]});if(!count){msg.className='err';msg.textContent='Please select at least one item.';return}data.total=updateTotal();btn.disabled=true;btn.textContent='Submitting...';try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});msg.className='ok';msg.textContent='Order submitted successfully!';e.target.reset();updateTotal()}catch(err){console.error(err);msg.className='err';msg.textContent='Could not send order. Please try again.'}finally{btn.disabled=false;btn.textContent='Submit Order'}});updateTotal();
</script></body></html>
