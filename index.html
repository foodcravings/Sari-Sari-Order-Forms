<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SARI SARI ORDER FORM</title>
<style>
body{font-family:Arial,sans-serif;background:#fff7dd;margin:0;padding:20px;color:#332211}.wrap{max-width:700px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 6px 24px #0002}h1{color:#7b4d00;margin-top:0}label{font-weight:700}input,select,button{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border:1px solid #bbb;border-radius:9px;font-size:16px}.row{display:grid;grid-template-columns:1fr 115px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.price{font-size:13px;color:#666}.total{font-size:22px;font-weight:700;color:#7b4d00;margin-top:18px}button{background:#7b4d00;color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:20px}button:disabled{opacity:.6}#msg{margin-top:14px;font-weight:700}.ok{color:#18723c}.err{color:#b42318}
</style>
</head>
<body><main class="wrap"><h1>SARI SARI ORDER FORM</h1><form id="form">
<label for="name">Customer Name</label><input id="name" required placeholder="Your name">
<div class="row"><div><b>Balot</b><div class="price">₱25 each</div></div><select id="balot"></select></div>
<div class="row"><div><b>Penoy Sabaw</b><div class="price">₱20 each</div></div><select id="penoySabaw"></select></div>
<div class="row"><div><b>Penoy Tuyo</b><div class="price">₱20 each</div></div><select id="penoyTuyo"></select></div>
<div class="row"><div><b>Pugo</b><div class="price">₱5 each</div></div><select id="pugo"></select></div>
<div class="row"><div><b>Suka Small</b><div class="price">₱60 each</div></div><select id="sukaSmall"></select></div>
<div class="row"><div><b>Suka Big</b><div class="price">₱100 each</div></div><select id="sukaBig"></select></div>
<div id="total" class="total">Total: ₱0</div><button id="btn" type="submit">Submit Order</button><div id="msg" aria-live="polite"></div>
</form></main>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbwZctds0Si3wyhT-psJt30BBlXgTRh-A-272DCYWM86wKGWSp5mM0Fyly6K3avin-YE/exec';
const ids=['balot','penoySabaw','penoyTuyo','pugo','sukaSmall','sukaBig'];
const prices={balot:25,penoySabaw:20,penoyTuyo:20,pugo:5,sukaSmall:60,sukaBig:100};
ids.forEach(id=>{const s=document.getElementById(id);for(let i=0;i<=50;i++){const o=document.createElement('option');o.value=i;o.textContent=i;s.appendChild(o)}s.addEventListener('change',updateTotal)});
function updateTotal(){let t=0;ids.forEach(id=>t+=Number(document.getElementById(id).value||0)*prices[id]);document.getElementById('total').textContent='Total: ₱'+t.toLocaleString('en-PH');return t}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg'),btn=document.getElementById('btn'),name=document.getElementById('name').value.trim();msg.className='';msg.textContent='';if(!name){msg.className='err';msg.textContent='Please enter customer name.';return}const data={name};let count=0;ids.forEach(id=>{data[id]=Number(document.getElementById(id).value||0);count+=data[id]});if(!count){msg.className='err';msg.textContent='Please select at least one item.';return}data.total=updateTotal();btn.disabled=true;btn.textContent='Submitting...';try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});msg.className='ok';msg.textContent='Order submitted. Please check the Orders sheet.';e.target.reset();updateTotal()}catch(err){console.error(err);msg.className='err';msg.textContent='Could not send order. Please try again.'}finally{btn.disabled=false;btn.textContent='Submit Order'}});updateTotal();
</script></body></html>
